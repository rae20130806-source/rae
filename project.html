<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#3a2d26" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%233a2d26'/%3E%3Ctext x='32' y='45' font-family='Georgia' font-size='40' fill='%23e8c98f' text-anchor='middle' font-style='italic'%3ER%3C/text%3E%3C/svg%3E">
<title>项目详情 — Rae</title>
<style>
@font-face{font-family:'Playfair';src:url('fonts/playfair.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:'Playfair';src:url('fonts/playfair-italic.woff2') format('woff2');font-weight:400 700;font-style:italic;font-display:swap}
@font-face{font-family:'Caveat';src:url('fonts/caveat.woff2') format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'DM Sans';src:url('fonts/dmsans.woff2') format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'MaShan';src:url('fonts/mashan.woff2') format('woff2');font-display:swap}
@font-face{font-family:'ZCOOL';src:url('fonts/zcool.woff2') format('woff2');font-display:swap}
:root{
  --brown:#3a2d26;--brown2:#4a3a31;--brown-ink:#2a211b;--mint:#bcd8d8;--mint-ink:#27595e;
  --cream:#f4eee2;--paper:#fffdf7;--paper2:#fbf6ec;--ink:#241d17;--soft:#6b5d51;--faint:#a29789;
  --line:#ded3c2;--accent:#b35840;
  --serif:'Playfair',Georgia,'Songti SC','STSong',serif;--brush:'MaShan','STKaiti','KaiTi',cursive;
  --zh:'ZCOOL','Songti SC','STSong',serif;--script:'Caveat','Segoe Script',cursive;
  --sans:'DM Sans','PingFang SC','Microsoft YaHei',sans-serif;--pad:clamp(20px,5.5vw,80px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
img,video{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.skip{position:absolute;left:-9999px;top:0;background:var(--brown);color:#fff;padding:10px 16px;z-index:999}
.skip:focus{left:12px;top:12px}
.star{position:absolute;width:34px;height:34px;color:#e8c98f;pointer-events:none}
.star--sm{width:20px;height:20px}
.script{font-family:var(--script);font-weight:600;font-style:italic;line-height:1}
.tape{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);width:78px;height:22px;background:rgba(233,222,199,.85);border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08)}

#hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px var(--pad);background:rgba(244,238,226,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--brown)}
.brand i{color:var(--accent)}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav a{padding:7px 13px;border:1px solid transparent;border-radius:999px;font-size:13px;color:var(--soft)}
.nav a:hover{border-color:var(--brown);color:var(--brown);background:var(--paper)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:transparent;padding:7px 11px;font-size:12px;color:var(--soft)}
.lang button.is-active{background:var(--brown);color:#fff}

.back{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);letter-spacing:.05em;margin-bottom:34px}
.back:hover{color:var(--accent)}

/* article hero */
.art-hero{position:relative;overflow:hidden;background:var(--brown);color:#f3e9da;padding:clamp(54px,8vw,96px) var(--pad)}
.art-hero .halftone{position:absolute;inset:0;background-image:radial-gradient(#e9d3b3 1.4px,transparent 1.5px);background-size:13px 13px;opacity:.13;pointer-events:none}
.art-hero .wrap,.art-body .wrap{position:relative;z-index:2;max-width:960px;margin:0 auto}
.pno{font-family:var(--serif);font-size:clamp(60px,9vw,110px);line-height:.9;color:#b58f6a;opacity:.9}
.art-hero h1{font-family:var(--serif);font-size:clamp(30px,4.6vw,58px);font-weight:600;line-height:1.12;margin:10px 0 12px;letter-spacing:-.02em}
.art-hero .sub{font-family:var(--zh);font-size:clamp(15px,1.8vw,19px);color:#d8c6ae;max-width:720px;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.badges span{font-size:12px;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 13px;color:#e8d7bf}
.script-tag{position:absolute;top:16%;right:8%;font-size:clamp(30px,4vw,56px);color:#bcd8d8;transform:rotate(-9deg)}

/* body */
.art-body{background:var(--paper);padding:clamp(50px,7vw,90px) var(--pad)}
.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:48px}
.meta{background:var(--paper2);padding:18px 20px}
.meta .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.meta .v{font-family:var(--zh);font-size:14px;color:var(--ink);margin-top:6px;line-height:1.7}

.report h2{font-family:var(--zh);font-size:clamp(20px,2.4vw,27px);color:var(--brown);margin:44px 0 16px;padding-bottom:10px;border-bottom:2px solid var(--accent);display:inline-block}
.report h2:first-child{margin-top:0}
.report p{font-family:var(--zh);font-size:15.5px;line-height:2;color:#3f352d;margin:0 0 14px}
.report ol,.report ul{margin:0 0 18px;padding-left:26px}
.report ol li,.report ul li{font-family:var(--zh);font-size:15px;line-height:1.95;color:#3f352d;margin-bottom:9px}
.report ol li::marker{font-family:var(--serif);color:var(--accent);font-weight:700}
.report ul li::marker{color:var(--accent)}
.report .quote{background:var(--cream);border-left:4px solid var(--accent);padding:18px 22px;margin:18px 0;font-family:var(--zh);font-size:15px;line-height:1.95;color:#4a3b30;transform:rotate(-.3deg);box-shadow:4px 5px 0 rgba(58,45,38,.07)}
.report .note{font-family:var(--zh);font-size:13px;color:var(--faint);border-top:1px dashed var(--line);padding-top:14px;margin-top:6px}
.report table{width:100%;border-collapse:collapse;margin:18px 0 10px;font-family:var(--zh);font-size:14.5px}
.report th,.report td{border:1px solid var(--line);padding:12px 16px;text-align:left;line-height:1.6}
.report th{background:var(--brown);color:#f3e9da;font-weight:600}
.report tr:nth-child(even) td{background:var(--paper2)}

/* STAR sections for non-report projects */
.star-sec{margin:0 0 30px;padding:22px 26px;background:var(--paper2);border:1px solid var(--line);box-shadow:5px 6px 0 rgba(58,45,38,.07)}
.star-sec h3{font-family:var(--serif);font-size:17px;color:var(--accent);margin:0 0 10px;letter-spacing:.02em}
.star-sec p{font-family:var(--zh);font-size:15px;line-height:1.95;margin:0 0 9px;color:#3f352d}
.evidence{margin:34px 0}
.ev-figure{margin:0 0 24px}
.ev-figure img,.ev-figure video{width:100%;border:1px solid var(--line);box-shadow:7px 9px 0 rgba(58,45,38,.12)}
.ev-figure figcaption{font-family:var(--zh);font-size:13px;color:var(--soft);margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.stat{background:var(--mint);padding:18px 12px;text-align:center;color:var(--mint-ink)}
.stat .n{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
.stat .l{font-family:var(--zh);font-size:12px;margin-top:6px}
.disclaimer{margin-top:40px;padding:16px 20px;background:var(--cream);border:1px dashed var(--line);font-family:var(--zh);font-size:13px;color:var(--soft)}

/* prev/next */
.pager{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--cream);padding:40px var(--pad)}
.pager a{font-family:var(--zh);font-size:14px;color:var(--brown);border:1px solid var(--line);background:var(--paper);padding:12px 20px}
.pager a:hover{border-color:var(--accent);color:var(--accent)}
#ftr{background:var(--brown-ink);color:#9d8d7b;padding:22px var(--pad);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--brown);color:#fff;padding:12px 22px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.is-show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.meta-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.script-tag{display:none}}
</style>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<header id="hdr"></header>
<main id="main">
  <section class="art-hero" id="hero"></section>
  <section class="art-body" id="body"></section>
</main>
<nav class="pager" id="pager"></nav>
<footer id="ftr"></footer>
<div id="toast"></div>
<script src="content.js"></script>
<script>
(function(){
  var DATA=window.SITE_DATA;
  var params=new URLSearchParams(location.search);
  var id=params.get('id');
  var lang=params.get('lang')==='en'?'en':'zh';
  function t(){return DATA[lang];}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function paras(a){return (a||[]).map(function(p){return '<p>'+esc(p)+'</p>';}).join('');}
  function setLang(n){var q=new URLSearchParams(location.search);q.set('lang',n);location.search=q.toString();}
  function toast(m){var b=document.getElementById('toast');b.textContent=m;b.classList.add('is-show');clearTimeout(b._t);b._t=setTimeout(function(){b.classList.remove('is-show');},3200);}
  var p=(t().projects||[]).filter(function(x){return x.id===id;})[0];

  function renderHeader(){
    var d=t(),links=d.nav.map(function(n){return '<a href="index.html#'+n.id+'">'+esc(n.label)+'</a>';}).join('');
    document.getElementById('hdr').innerHTML=
      '<a class="brand" href="index.html">Rae<i>.</i></a><nav class="nav">'+links+'</nav>'+
      '<div class="lang"><button type="button" data-lang="zh" class="'+(lang==='zh'?'is-active':'')+'">中</button><button type="button" data-lang="en" class="'+(lang==='en'?'is-active':'')+'">EN</button></div>';
    document.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){setLang(b.getAttribute('data-lang'));});});
  }

  function renderHero(){
    if(!p){document.getElementById('hero').innerHTML='<div class="wrap"><h1>Project not found</h1><a class="back" href="index.html">← '+esc(t().ui.backHome)+'</a></div>';return;}
    document.getElementById('hero').innerHTML=
      '<div class="halftone"></div><div class="script script-tag">project</div>'+
      '<div class="wrap"><a class="back" href="index.html#portfolio">← '+esc(t().ui.backHome)+'</a>'+
      '<div class="pno">'+esc(p.no)+' / 08</div>'+
      '<h1>'+esc(p.title)+'</h1><p class="sub">'+esc(p.subtitle)+'</p>'+
      '<div class="badges">'+p.badge.map(function(b){return '<span>'+esc(b)+'</span>';}).join('')+'</div></div>';
  }

  function reportHTML(r){
    var blocks=(r.blocks||[]).map(function(b){
      if(b.t==='h')return '<h2>'+esc(b.v)+'</h2>';
      if(b.t==='p')return '<p>'+esc(b.v)+'</p>';
      if(b.t==='ol')return '<ol>'+b.v.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
      if(b.t==='ul')return '<ul>'+b.v.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
      if(b.t==='quote')return '<div class="quote">'+esc(b.v)+'</div>';
      if(b.t==='note')return '<div class="note">'+esc(b.v)+'</div>';
      if(b.t==='table')return '<table><thead><tr>'+b.head.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+b.rows.map(function(row){return '<tr>'+row.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
      return '';
    }).join('');
    var meta=(r.meta||[]).map(function(m){return '<div class="meta"><div class="k">'+esc(m.label)+'</div><div class="v">'+esc(m.value)+'</div></div>';}).join('');
    return '<div class="meta-grid">'+meta+'</div><div class="report">'+blocks+'</div>';
  }

  function evidenceHTML(p){
    if(!p.evidence||!p.evidence.length)return '';
    var figs=p.evidence.map(function(e){
      var media=e.type==='video'
        ? '<video controls preload="metadata" poster="'+esc(e.poster||'')+'"><source src="'+esc(e.src)+'" type="video/mp4"></video>'
        : '<img loading="lazy" src="'+esc(e.src)+'" alt="'+esc(e.caption||'')+'">';
      return '<figure class="ev-figure">'+media+'<figcaption>'+esc(e.caption||'')+'</figcaption></figure>';
    }).join('');
    return '<div class="evidence"><h2 style="font-family:var(--zh);font-size:22px;color:var(--brown);margin:34px 0 16px">'+esc(t().ui.materials||'')+'</h2>'+figs+'</div>';
  }

  function sectionsHTML(p){
    if(!p.sections||!p.sections.length)return '';
    return p.sections.map(function(s){
      return '<section class="star-sec"><h3>'+esc(t().ui[s.key]||s.key)+'</h3>'+paras(s.body)+'</section>';
    }).join('');
  }

  function renderBody(){
    if(!p)return;
    var h='';
    h+=p.report?reportHTML(p.report):sectionsHTML(p);
    if(p.stats){h+='<div class="stats">'+p.stats.map(function(s){return '<div class="stat"><div class="n">'+esc(s.value)+'</div><div class="l">'+esc(s.label)+'</div></div>';}).join('')+'</div>'+(p.statsNote?'<p class="note">'+esc(p.statsNote)+'</p>':'');}
    h+=evidenceHTML(p);
    if(p.materials&&!p.report)h+='<p class="note" style="font-family:var(--zh);font-size:13px;color:var(--faint);margin-top:24px">'+esc(p.materials)+'</p>';
    if(p.evidenceNote)h+='<p class="note">'+esc(p.evidenceNote)+'</p>';
    if(p.disclaimer)h+='<div class="disclaimer">'+esc(p.disclaimer)+'</div>';
    document.getElementById('body').innerHTML='<div class="wrap">'+h+'</div>';
  }

  function renderPager(){
    var list=t().projects,idx=list.findIndex(function(x){return x.id===id;}),h='';
    if(idx>0)h+='<a href="project.html?id='+encodeURIComponent(list[idx-1].id)+'&lang='+lang+'">← '+esc(list[idx-1].title)+'</a>';
    else h+='<span></span>';
    if(idx>-1&&idx<list.length-1)h+='<a href="project.html?id='+encodeURIComponent(list[idx+1].id)+'&lang='+lang+'">'+esc(list[idx+1].title)+' →</a>';
    document.getElementById('pager').innerHTML=h;
  }
  function renderFooter(){var d=t().footer;document.getElementById('ftr').innerHTML='<span>© Rae · 张楠</span><span>'+esc(d.tagline)+'</span>';}

  renderHeader();renderHero();renderBody();renderPager();renderFooter();
})();
</script>
</body>
</html>
