<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#3a2d26" />
<meta name="description" content="Rae 张楠 — AI 产品运营 / 内容创作个人求职作品集" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%233a2d26'/%3E%3Ctext x='32' y='45' font-family='Georgia' font-size='40' fill='%23e8c98f' text-anchor='middle' font-style='italic'%3ER%3C/text%3E%3C/svg%3E">
<title>Rae 张楠 — AI Product Operations｜个人求职作品集</title>
<style>
/* ============ Fonts (self-hosted subsets) ============ */
@font-face{font-family:'Playfair';src:url('fonts/playfair.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:'Playfair';src:url('fonts/playfair-italic.woff2') format('woff2');font-weight:400 700;font-style:italic;font-display:swap}
@font-face{font-family:'Caveat';src:url('fonts/caveat.woff2') format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'DM Sans';src:url('fonts/dmsans.woff2') format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'MaShan';src:url('fonts/mashan.woff2') format('woff2');font-display:swap}
@font-face{font-family:'ZCOOL';src:url('fonts/zcool.woff2') format('woff2');font-display:swap}

:root{
  --brown:#3a2d26; --brown2:#4a3a31; --brown-ink:#2a211b;
  --mint:#bcd8d8; --mint-ink:#27595e;
  --cream:#f4eee2; --paper:#fffdf7; --paper2:#fbf6ec;
  --ink:#241d17; --soft:#6b5d51; --faint:#a29789;
  --line:#ded3c2; --accent:#b35840;
  --serif:'Playfair',Georgia,'Songti SC','STSong',serif;
  --brush:'MaShan','STKaiti','KaiTi',cursive;
  --zh:'ZCOOL','Songti SC','STSong',serif;
  --script:'Caveat','Segoe Script',cursive;
  --sans:'DM Sans','PingFang SC','Microsoft YaHei',sans-serif;
  --pad:clamp(20px,5.5vw,80px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
::selection{background:var(--mint);color:var(--brown)}
.skip{position:absolute;left:-9999px;top:0;background:var(--brown);color:#fff;padding:10px 16px;z-index:999}
.skip:focus{left:12px;top:12px}

/* ---- reusable doodles & stickers ---- */
.star{position:absolute;width:34px;height:34px;color:#e8c98f;pointer-events:none}
.star--sm{width:20px;height:20px}
.star--line{fill:none;stroke:currentColor;stroke-width:2.2}
.script{font-family:var(--script);font-weight:600;font-style:italic;line-height:1}
.sticker{display:inline-block;background:var(--paper);border:1px solid var(--line);box-shadow:3px 4px 0 rgba(0,0,0,.07);padding:8px 14px;font:600 11px/1.3 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--brown)}
.halftone{position:absolute;inset:0;background-image:radial-gradient(currentColor 1.4px,transparent 1.5px);background-size:13px 13px;opacity:.14;pointer-events:none}
.tape{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);width:78px;height:22px;background:rgba(233,222,199,.85);border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08)}

/* ---- header ---- */
#hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px var(--pad);background:rgba(244,238,226,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--brown)}
.brand i{color:var(--accent)}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav a{padding:7px 13px;border:1px solid transparent;border-radius:999px;font-size:13px;letter-spacing:.04em;color:var(--soft);transition:.2s}
.nav a:hover,.nav a.is-active{border-color:var(--brown);color:var(--brown);background:var(--paper)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:transparent;padding:7px 11px;font-size:12px;color:var(--soft)}
.lang button.is-active{background:var(--brown);color:#fff}

/* ---- generic section ---- */
.sec{position:relative;overflow:hidden;padding:clamp(70px,10vw,130px) var(--pad)}
.wrap{max-width:1180px;margin:0 auto;position:relative;z-index:2}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin:0 0 18px}
.eyebrow::before{content:'';width:26px;height:1px;background:currentColor}
.h-serif{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;line-height:1.12;margin:0}
.h-brush{font-family:var(--brush);font-weight:400;line-height:1.1}
.watermark{position:absolute;font-family:var(--serif);font-weight:700;letter-spacing:.02em;white-space:nowrap;pointer-events:none;user-select:none;opacity:.06}

/* ---- hero ---- */
.hero{background:var(--brown);color:#f3e9da;padding-top:clamp(60px,8vw,100px)}
.hero .halftone{color:#e9d3b3}
.hero-inner{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center}
.hero-kicker{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#cbb69a;margin:28px 0 14px}
.hero h1{margin:0;font-family:var(--serif);font-size:clamp(50px,7.4vw,104px);font-weight:600;line-height:.98;letter-spacing:-.035em}
.hero h1 em{font-style:italic;color:#e6b98f}
.hero .cn-name{font-family:var(--brush);font-size:clamp(42px,6vw,82px);color:#f0e2c9;margin-top:10px;letter-spacing:.06em}
.hero .script.hero-scribble{position:absolute;top:14%;left:6%;font-size:clamp(34px,4.4vw,64px);color:#bcd8d8;transform:rotate(-11deg);opacity:.92}
.hero-role{margin:26px 0 8px;font-size:clamp(16px,1.7vw,21px);color:#e8d7bf;font-family:var(--zh)}
.hero-tag{max-width:540px;color:#c9b7a2;font-size:15px;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}
.chip{display:inline-block;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 14px;font-size:12px;letter-spacing:.04em}
.chip--fill{background:#e8d7bd;color:var(--brown);border-color:transparent}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--brown);background:var(--brown);color:#fff;padding:12px 22px;font-size:14px;letter-spacing:.05em;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn--ghost{background:transparent;color:#f0e2c9;border-color:rgba(255,255,255,.45)}
.photo-card{position:relative;background:var(--paper);padding:14px 14px 30px;box-shadow:12px 16px 0 rgba(0,0,0,.18);transform:rotate(3deg)}
.photo-card img{width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(.12)}
.photo-card figcaption{font-family:var(--script);font-size:26px;color:var(--blue);text-align:center;margin-top:8px;transform:rotate(-4deg)}
.hero-meta{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:70px;padding-top:22px;border-top:1px solid rgba(255,255,255,.16);font-size:13px;color:#c9b7a2}
.hero-meta b{color:#efe0c9;font-weight:600}

/* ---- about ---- */
.about{background:var(--mint);color:var(--mint-ink)}
.about .watermark{color:var(--mint-ink);font-size:clamp(90px,17vw,230px);top:24px;right:10px}
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px}
.about .h-serif{font-size:clamp(30px,3.6vw,50px);color:var(--brown)}
.about .intro p{margin:0 0 16px;font-family:var(--zh);font-size:15.5px;line-height:1.95;color:#2c5559}
.exp-list{display:grid;gap:12px}
.exp{position:relative;background:var(--paper);border:1px solid rgba(39,89,94,.18);padding:18px 22px;box-shadow:5px 6px 0 rgba(39,89,94,.12);transform:rotate(-.6deg)}
.exp:nth-child(even){transform:rotate(.8deg)}
.exp h4{margin:0 0 6px;font-family:var(--serif);font-size:18px;color:var(--brown)}
.exp p{margin:0;font-family:var(--zh);font-size:14px;line-height:1.8;color:#4a6b6d}

/* ---- strengths (简洁明了) ---- */
.strengths{background:var(--cream)}
.strengths .h-serif{font-size:clamp(28px,3.4vw,46px);color:var(--brown)}
.strength-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:38px}
.strength{background:var(--paper);padding:28px 26px 30px;min-height:168px}
.strength .no{font-family:var(--serif);font-size:38px;color:#cbb69a;line-height:1}
.strength h4{margin:12px 0 8px;font-family:var(--zh);font-size:17px;color:var(--brown)}
.strength p{margin:0;font-family:var(--zh);font-size:13.5px;line-height:1.85;color:var(--soft)}
.skills-strip{margin-top:46px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.skill-group{background:var(--paper2);border:1px solid var(--line);padding:20px 22px}
.skill-group h5{margin:0 0 12px;font-family:var(--serif);font-size:16px;color:var(--brown)}
.skill-group .tags{display:flex;flex-wrap:wrap;gap:7px}
.skill-group .tags span{background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--soft)}
.skill-group p{margin:12px 0 0;font-family:var(--zh);font-size:12.5px;color:var(--faint)}
.note-line{margin-top:22px;font-family:var(--zh);font-size:12.5px;color:var(--faint)}

/* ---- portfolio ---- */
.portfolio{background:var(--paper);color:var(--ink)}
.portfolio .h-serif{font-size:clamp(30px,3.8vw,52px);color:var(--brown)}
.subhead{display:flex;align-items:baseline;gap:14px;margin:0 0 8px}
.subhead .script{font-size:34px;color:var(--accent);transform:rotate(-4deg)}
.pcards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:34px}
.pcard{position:relative;display:block;background:var(--paper2);border:1px solid var(--line);padding:30px 30px 28px;min-height:230px;transition:.25s;overflow:hidden}
.pcard:nth-child(4n+1){background:#f6efe3}
.pcard:nth-child(4n+2){background:#eef3f0}
.pcard:nth-child(4n+3){background:#f3ecec}
.pcard:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:9px 12px 0 rgba(58,45,38,.12)}
.pcard .pno{font-family:var(--serif);font-size:52px;line-height:1;color:#c9bba6}
.pcard .arrow{position:absolute;top:28px;right:30px;font-size:26px;color:var(--accent)}
.pcard .pcat{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-top:14px}
.pcard h3{margin:10px 0 8px;font-family:var(--zh);font-size:clamp(20px,2.2vw,27px);color:var(--brown);line-height:1.35}
.pcard .psub{font-family:var(--zh);font-size:13.5px;color:var(--soft);margin:0 0 16px}
.badges{display:flex;flex-wrap:wrap;gap:7px}
.badges span{font-size:11px;letter-spacing:.06em;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--soft);background:var(--paper)}
.mini-label{margin:64px 0 20px;font:600 12px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--brown);display:flex;align-items:center;gap:12px}
.mini-label::after{content:'';flex:1;height:1px;background:var(--line)}
.minicards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.minicard{background:var(--paper2);border:1px solid var(--line);padding:20px 18px;min-height:132px;transition:.2s}
.minicard:hover{transform:translateY(-3px);box-shadow:5px 7px 0 rgba(58,45,38,.1)}
.minicard .no{font-family:var(--serif);font-size:22px;color:#c9bba6}
.minicard h4{margin:8px 0 6px;font-family:var(--zh);font-size:16px;color:var(--brown)}
.minicard p{margin:0;font-family:var(--zh);font-size:12.5px;line-height:1.7;color:var(--soft)}

/* ---- contact ---- */
.contact{background:var(--brown2);color:#f1e5d3}
.contact .watermark{color:#f1e5d3;font-size:clamp(80px,15vw,200px);bottom:-10px;left:20px;opacity:.05}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:end}
.contact .h-serif{font-size:clamp(42px,6vw,82px);color:#f6e9d3;line-height:1.02}
.contact .h-brush{font-family:var(--brush);font-size:clamp(30px,4vw,52px);color:#bcd8d8;margin-top:8px}
.contact .intro{color:#cbb69a;font-family:var(--zh);font-size:15px;max-width:460px;margin:22px 0 0}
.contact-box{position:relative;background:var(--paper);color:var(--brown);padding:30px 32px;box-shadow:10px 12px 0 rgba(0,0,0,.2);transform:rotate(1deg)}
.contact-box .row{padding:14px 0;border-bottom:1px solid var(--line)}
.contact-box .row:last-of-type{border-bottom:0}
.contact-box .lab{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
.contact-box .val{font-family:var(--serif);font-size:clamp(18px,2.2vw,26px);margin-top:4px;word-break:break-word;display:block}
a.val:hover{color:var(--accent)}
.contact-box .btn{margin-top:20px;width:100%;justify-content:center}
#ftr{background:var(--brown-ink);color:#9d8d7b;padding:26px var(--pad);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;font-size:12px}
#ftr a{color:#d9c7ae}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--brown);color:#fff;padding:12px 22px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#toast.is-show{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
  .hero-inner,.about-grid,.contact-grid{grid-template-columns:1fr;gap:40px}
  .hero .script.hero-scribble{top:6%;left:auto;right:4%}
  .photo-card{max-width:340px}
  .strength-grid,.skills-strip{grid-template-columns:1fr 1fr}
  .pcards{grid-template-columns:1fr}
  .minicards{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav a{padding:6px 9px;font-size:12px}
  .strength-grid,.skills-strip,.minicards{grid-template-columns:1fr}
  .hero-meta{gap:14px 22px}
  .contact-box{padding:24px 22px}
}
</style>
</head>
<body>
<a class="skip" href="#home">跳到主要内容</a>
<header id="hdr"></header>
<main>
  <section class="sec hero" id="home"></section>
  <section class="sec about" id="about"></section>
  <section class="sec strengths" id="strengths"></section>
  <section class="sec portfolio" id="portfolio"></section>
  <section class="sec contact" id="contact"></section>
</main>
<footer id="ftr"></footer>
<div id="toast"></div>

<script src="content.js"></script>
<script>
(function(){
  var DATA=window.SITE_DATA, lang='zh', navObserver=null;
  function getLang(){var p=new URLSearchParams(location.search).get('lang');if(p==='zh'||p==='en')return p;var s=localStorage.getItem('rae-lang');return s==='en'?'en':'zh';}
  lang=getLang();
  function t(){return DATA[lang];}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function paras(a){return (a||[]).map(function(p){return '<p>'+esc(p)+'</p>';}).join('');}
  function setLang(n){if(n!=='zh'&&n!=='en')return;lang=n;localStorage.setItem('rae-lang',n);render();}
  function toast(m){var b=document.getElementById('toast');b.textContent=m;b.classList.add('is-show');clearTimeout(b._t);b._t=setTimeout(function(){b.classList.remove('is-show');},3200);}
  function star(cls,style){return '<svg class="star '+(cls||'')+'" style="'+style+'" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.7 6.6 4.7 10.6 12 12-7.3 1.4-11.3 5.4-12 12-.7-6.6-4.7-10.6-12-12C7.3 10.6 11.3 6.6 12 0z"/></svg>';}
  function puzzleUrl(id){return 'project.html?id='+encodeURIComponent(id)+'&lang='+lang;}
  function resumeUrl(){return t().contact.resumePdf||'';}

  function renderHeader(){
    var d=t(),links=d.nav.map(function(n){return '<a href="#'+n.id+'" data-nav="'+n.id+'">'+esc(n.label)+'</a>';}).join('');
    document.getElementById('hdr').innerHTML=
      '<a class="brand" href="#home">Rae<i>.</i></a>'+
      '<nav class="nav" id="nav">'+links+'</nav>'+
      '<div class="lang"><button type="button" data-lang="zh" class="'+(lang==='zh'?'is-active':'')+'">中</button><button type="button" data-lang="en" class="'+(lang==='en'?'is-active':'')+'">EN</button></div>';
    document.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){setLang(b.getAttribute('data-lang'));});});
    var nav=document.getElementById('nav');
    if(navObserver)navObserver.disconnect();
    navObserver=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){document.querySelectorAll('[data-nav]').forEach(function(a){a.classList.toggle('is-active',a.getAttribute('data-nav')===en.target.id);});}});},{rootMargin:'-45% 0px -50% 0px'});
    d.nav.forEach(function(n){var el=document.getElementById(n.id);if(el)navObserver.observe(el);});
  }

  function renderHero(){
    var d=t().hero, chips=d.seeking.map(function(s){return '<span class="chip chip--fill">'+esc(s)+'</span>';}).join('');
    var resumeBtn=resumeUrl()?'<a class="btn" href="'+esc(resumeUrl())+'" target="_blank" rel="noopener">↓ '+esc(t().ui.downloadResume)+'</a>':'';
    document.getElementById('home').innerHTML=
      '<div class="halftone"></div>'+star('','top:8%;right:6%;width:50px;height:50px;color:#e8c98f')+star('star--sm','bottom:16%;left:3%;color:#bcd8d8')+
      '<div class="script hero-scribble">hello!</div>'+
      '<div class="wrap"><div class="hero-inner">'+
        '<div class="hero-copy">'+
          '<span class="sticker">Rae’s · Portfolio ’27</span>'+
          '<p class="hero-kicker">'+esc(d.eyebrow)+'</p>'+
          '<h1>Hi, I’m <em>'+esc(d.nameEn)+'.</em></h1>'+
          '<div class="cn-name">'+esc(d.name)+'</div>'+
          '<p class="hero-role">'+esc(d.role)+'</p>'+
          '<p class="hero-tag">'+esc(d.tagline)+'</p>'+
          '<div class="chips">'+chips+'</div>'+
          '<div class="btns"><a class="btn btn--ghost" href="#portfolio">'+esc(t().ui.viewWork)+' ↗</a>'+resumeBtn+'</div>'+
        '</div>'+
        '<figure class="photo-card"><span class="tape"></span><img src="'+esc(d.photo)+'" alt="'+esc(d.name)+'"><figcaption>that’s me :)</figcaption></figure>'+
      '</div>'+
      '<div class="hero-meta"><span><b>'+esc(t().ui.seeking)+' · </b>'+esc(d.seeking.join(' / '))+'</span><span><b>'+esc(t().ui.location)+' · </b>'+esc(d.location)+'</span><span><b>'+esc(t().ui.availability)+' · </b>'+esc(d.availability)+'</span></div>'+
      '</div>';
  }

  function renderAbout(){
    var d=t().about,exps=d.experiences.map(function(e){return '<article class="exp"><h4>'+esc(e.title)+'</h4>'+paras(e.paragraphs)+'</article>';}).join('');
    document.getElementById('about').innerHTML=
      '<div class="watermark">PORTFOLIO</div>'+star('star--line star--sm','top:40px;left:46%')+star('star--sm','bottom:12%;right:5%;color:#b35840')+
      '<div class="wrap"><p class="eyebrow">'+esc(d.eyebrow)+'</p>'+
      '<div class="about-grid">'+
        '<div><h2 class="h-serif">'+esc(d.title)+'</h2><div class="intro" style="margin-top:26px">'+paras(d.intro)+'</div><div class="script" style="font-size:38px;color:#b35840;margin-top:18px;transform:rotate(-4deg)">nice to meet you!</div></div>'+
        '<div class="exp-list">'+exps+'</div>'+
      '</div></div>';
  }

  function renderStrengths(){
    var c=t().competencies,items=c.items.map(function(it){return '<article class="strength"><div class="no">'+esc(it.no)+'</div><h4>'+esc(it.title)+'</h4><p>'+esc(it.desc)+'</p></article>';}).join('');
    var sk=t().skills.groups.map(function(g){return '<div class="skill-group"><h5>'+esc(g.title)+'</h5><div class="tags">'+g.tools.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div><p>'+esc(g.usage)+'</p></div>';}).join('');
    document.getElementById('strengths').innerHTML=
      star('star--sm','top:36px;right:6%;color:#b35840')+
      '<div class="wrap"><p class="eyebrow">'+esc(c.eyebrow)+'</p>'+
      '<h2 class="h-serif">'+esc(c.title)+'</h2>'+
      '<div class="strength-grid">'+items+'</div>'+
      '<div class="mini-label">'+esc(t().skills.eyebrow)+'</div>'+
      '<div class="skills-strip">'+sk+'</div>'+
      '<p class="note-line">'+esc(t().skills.note)+'</p>'+
      '</div>';
  }

  function card(p){
    var cat=(t().categories||[]).filter(function(c){return c.key===p.category;})[0];
    return '<a class="pcard" href="'+puzzleUrl(p.id)+'"><span class="arrow">↗</span><span class="pno">'+esc(p.no)+'</span>'+
      '<div class="pcat">'+esc(cat?cat.name:p.type)+'</div>'+
      '<h3>'+esc(p.title)+'</h3><p class="psub">'+esc(p.subtitle)+'</p>'+
      '<div class="badges">'+p.badge.map(function(b){return '<span>'+esc(b)+'</span>';}).join('')+'</div></a>';
  }
  function mini(p){return '<a class="minicard" href="'+puzzleUrl(p.id)+'"><div class="no">'+esc(p.no)+'</div><h4>'+esc(p.title)+'</h4><p>'+esc(p.subtitle)+'</p></a>';}

  function renderPortfolio(){
    var d=t(),feat=d.projects.filter(function(p){return p.featured;}),rest=d.projects.filter(function(p){return !p.featured;});
    document.getElementById('portfolio').innerHTML=
      star('','top:40px;right:5%;width:44px;height:44px;color:#cdbb9f')+
      '<div class="wrap"><p class="eyebrow">Portfolio · 作品</p>'+
      '<div class="subhead"><h2 class="h-serif">Selected Works</h2><span class="script">featured</span></div>'+
      '<div class="pcards">'+feat.map(card).join('')+'</div>'+
      '<div class="mini-label">'+esc(t().ui.additional)+'</div>'+
      '<div class="minicards">'+rest.map(mini).join('')+'</div>'+
      '</div>';
  }

  function renderContact(){
    var d=t().contact,rows='';
    rows+='<div class="row"><div class="lab">'+esc(d.labels.email)+'</div><a class="val" href="mailto:'+esc(d.email)+'">'+esc(d.email)+'</a></div>';
    if(d.github)rows+='<div class="row"><div class="lab">'+esc(d.labels.github)+'</div><a class="val" href="'+esc(d.github)+'" target="_blank" rel="noopener">GitHub ↗</a></div>';
    var rb=resumeUrl()?'<a class="btn" href="'+esc(resumeUrl())+'" target="_blank" rel="noopener">↓ '+esc(d.labels.resume)+'</a>':'';
    document.getElementById('contact').innerHTML=
      '<div class="watermark">LET’S TALK</div>'+star('','top:12%;right:8%;color:#bcd8d8;width:46px;height:46px')+
      '<div class="script" style="top:8%;left:5%;font-size:40px;color:#e6b98f;position:absolute">say hi!</div>'+
      '<div class="wrap"><div class="contact-grid">'+
        '<div><p class="eyebrow" style="color:#e6b98f">'+esc(d.eyebrow)+'</p><h2 class="h-serif">'+esc(d.title)+'</h2><div class="h-brush">一起聊聊吧</div><p class="intro">'+esc(d.intro)+'</p></div>'+
        '<div class="contact-box"><span class="tape"></span>'+rows+rb+'</div>'+
      '</div></div>';
  }

  function renderFooter(){var d=t().footer;document.getElementById('ftr').innerHTML='<span>© Rae · 张楠 · '+esc(d.tagline)+'</span><span>'+esc(d.note)+' · '+esc(d.backToTop)+' ↑</span>';}

  function render(){renderHeader();renderHero();renderAbout();renderStrengths();renderPortfolio();renderContact();renderFooter();}
  render();
})();
</script>
</body>
</html>
