<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Rae 张楠 — AI Product Operations｜个人求职作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
/* ==========================================================================
   Rae Portfolio — Minimalist Editorial
   暖白 / 米色主调，衬线标题，网格与留白，移动优先
   ========================================================================== */

:root {
  --bg: #f6f3ec;
  --bg-alt: #efeae0;
  --paper: #fffdf8;
  --ink: #1c1a17;
  --ink-soft: #6f6a61;
  --ink-faint: #9a948a;
  --line: #d8d2c5;
  --line-strong: #bdb5a6;
  --accent: #8a6f4e;
  --accent-soft: #e7ddcd;
  --placeholder-bg: #e9e3d8;

  --font-serif: "Playfair Display", "Songti SC", "STSong", "SimSun", Georgia, serif;
  --font-sans: "DM Sans", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --wrap: 1120px;
  --pad: clamp(20px, 5vw, 64px);
  --section-y: clamp(64px, 10vw, 120px);
  --radius: 2px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img, video { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.skip-link { position: absolute; left: -9999px; top: 0; background: var(--ink); color: #fff; padding: 10px 16px; z-index: 1000; }
.skip-link:focus { left: 12px; top: 12px; }
.noscript { margin: 20px; padding: 16px 20px; background: #fff3d6; border: 1px solid #e0c98a; color: #5a4410; }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
  background: var(--ink); color: #fff; padding: 14px 20px; border-radius: var(--radius);
  font-size: 14px; line-height: 1.6; max-width: min(520px, 90vw); z-index: 300;
  opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 布局 / 排版 ---------- */
.wrap { width: 100%; max-width: var(--wrap); margin-inline: auto; padding-inline: var(--pad); }
.section { padding-block: var(--section-y); scroll-margin-top: 72px; }
.section--alt { background: var(--bg-alt); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin: 0 0 18px; }
.section-title { font-family: var(--font-serif); font-weight: 500; font-size: clamp(28px, 5vw, 50px); line-height: 1.18; letter-spacing: -0.01em; margin: 0 0 28px; }
.lead { font-size: clamp(16px, 2.2vw, 19px); line-height: 1.85; color: var(--ink-soft); max-width: 62ch; margin: 0 0 32px; }
.chip { display: inline-block; font-size: 12px; letter-spacing: 0.04em; padding: 5px 11px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink-soft); background: transparent; white-space: nowrap; }
.chip--accent { border-color: var(--accent); color: var(--accent); }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: var(--radius); font-size: 14px; font-weight: 600; letter-spacing: 0.02em; border: 1px solid var(--ink); transition: background .2s ease, color .2s ease, transform .2s ease, border-color .2s ease; }
.btn:hover { transform: translateY(-2px); }
.btn--solid { background: var(--ink); color: #fff; }
.btn--solid:hover { background: var(--accent); border-color: var(--accent); }
.btn--ghost { background: transparent; color: var(--ink); }
.btn--ghost:hover { background: var(--ink); color: #fff; }
.btn--sm { min-height: 40px; padding: 0 16px; font-size: 13px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; }

/* ---------- 导航 ---------- */
.site-header { position: sticky; top: 0; z-index: 100; background: rgba(246, 243, 236, .94); backdrop-filter: saturate(150%) blur(12px); -webkit-backdrop-filter: saturate(150%) blur(12px); border-bottom: 1px solid var(--line); }
.header-inner { display: flex; align-items: center; justify-content: space-between; min-height: 64px; gap: 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; font-family: var(--font-serif); font-size: 19px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand small { font-family: var(--font-sans); font-size: 10px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.nav { display: flex; align-items: center; gap: clamp(10px, 1.8vw, 24px); flex-wrap: wrap; }
.nav a { font-size: 13px; color: var(--ink-soft); position: relative; padding-block: 6px; white-space: nowrap; }
.nav a::after { content: ""; position: absolute; left: 0; bottom: 0; width: 0; height: 1px; background: var(--ink); transition: width .25s ease; }
.nav a:hover, .nav a.is-active { color: var(--ink); }
.nav a:hover::after, .nav a.is-active::after { width: 100%; }
.header-tools { display: flex; align-items: center; gap: 12px; }
.lang-toggle { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.lang-toggle button { border: 0; background: transparent; color: var(--ink-soft); font-size: 12px; font-weight: 600; letter-spacing: .06em; padding: 6px 11px; line-height: 1; }
.lang-toggle button.is-active { background: var(--ink); color: #fff; }
.menu-toggle { display: none; border: 1px solid var(--line-strong); background: transparent; border-radius: var(--radius); width: 40px; height: 36px; align-items: center; justify-content: center; flex-direction: column; gap: 5px; }
.menu-toggle span { width: 18px; height: 1.5px; background: var(--ink); display: block; }

/* ---------- Hero（照片大幅缩小） ---------- */
.hero { padding-top: clamp(44px, 8vw, 96px); }
.hero-grid { display: grid; grid-template-columns: 1fr auto; gap: clamp(28px, 5vw, 64px); align-items: center; }
.hero-copy { min-width: 0; }
.hero-name { font-family: var(--font-serif); font-size: clamp(48px, 10vw, 92px); line-height: .98; font-weight: 500; letter-spacing: -.02em; margin: 0; }
.hero-name .en { display: block; font-style: italic; color: var(--accent); font-size: .5em; margin-top: 4px; }
.hero-tagline { font-family: var(--font-serif); font-style: italic; font-size: clamp(17px, 2.6vw, 23px); line-height: 1.5; color: var(--accent); margin: 18px 0 6px; max-width: 22ch; }
.hero-role { font-size: clamp(13px, 2.4vw, 18px); letter-spacing: .04em; color: var(--ink); font-weight: 600; margin: 0 0 22px; }
.hero-seeking { margin-bottom: 18px; }
.hero-seeking__label { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
.hero-intro { color: var(--ink-soft); font-size: clamp(15px, 2.1vw, 18px); line-height: 1.8; max-width: 58ch; margin: 0 0 22px; }
.hero-meta { display: grid; gap: 6px; margin: 0 0 26px; font-size: 13px; color: var(--ink-soft); }
.hero-meta strong { color: var(--ink); font-weight: 600; }
.photo-frame {
  position: relative;
  width: clamp(120px, 16vw, 176px);
  aspect-ratio: 3 / 4;
  border: 1px solid var(--line-strong);
  background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,.018) 10px, rgba(0,0,0,.018) 11px), var(--placeholder-bg);
  border-radius: var(--radius);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 12px; overflow: hidden; flex-shrink: 0;
}
.photo-frame img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.photo-frame__icon { font-family: var(--font-serif); font-style: italic; font-size: 40px; color: var(--line-strong); line-height: 1; }
.photo-frame__text { font-size: 11px; color: var(--ink-soft); margin-top: 10px; }
.photo-frame__hint { font-size: 10px; color: var(--ink-faint); margin-top: 4px; }

/* ---------- About ---------- */
.about-grid-main { display: grid; gap: 30px; max-width: 820px; }
.about-block { padding-left: 22px; border-left: 2px solid var(--line-strong); }
.about-block__tag { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--accent); margin: 0 0 12px; }
.about-block p { margin: 0 0 14px; color: var(--ink-soft); font-size: 16px; line-height: 1.9; }
.about-block p:last-child { margin-bottom: 0; }

/* ---------- Competencies ---------- */
.comp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.comp-card { display: grid; grid-template-columns: 40px 1fr; gap: 16px; background: var(--paper); padding: 26px; }
.comp-card__no { font-family: var(--font-serif); font-style: italic; font-size: 22px; color: var(--accent); line-height: 1.2; }
.comp-card__body h3 { font-size: 18px; font-weight: 600; margin: 0 0 10px; }
.comp-card__body p { margin: 0 0 10px; font-size: 14px; line-height: 1.75; color: var(--ink-soft); }
.comp-card__detail { color: var(--ink-soft); }
.comp-card__note { font-size: 12px !important; color: var(--ink-faint) !important; border-left: 2px solid var(--line-strong); padding-left: 10px; }

/* ---------- Skills ---------- */
.skill-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(18px, 3vw, 30px); }
.skill-group { border-top: 1px solid var(--line-strong); padding-top: 18px; }
.skill-group h3 { font-size: 17px; font-weight: 600; margin: 0 0 14px; }
.skill-group__usage { font-size: 13px; line-height: 1.7; color: var(--ink-soft); margin: 14px 0 0; }
.skill-note { margin-top: 30px; font-size: 13px; color: var(--ink-faint); border-left: 2px solid var(--line-strong); padding-left: 14px; }

/* ---------- Resume ---------- */
.resume-note { font-size: 13px; color: var(--ink-soft); max-width: 56ch; }
.resume-block { margin-top: 40px; }
.resume-block h3 { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line-strong); font-weight: 600; }
.resume-item { display: grid; grid-template-columns: 1fr auto; gap: 6px 24px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.resume-item__title { font-size: 16px; font-weight: 600; margin: 0; }
.resume-item__sub { font-size: 13px; color: var(--accent); margin-top: 2px; }
.resume-item__time { font-size: 12px; color: var(--ink-faint); text-align: right; white-space: nowrap; }
.resume-item__desc { grid-column: 1 / -1; font-size: 13px; color: var(--ink-soft); margin-top: 4px; }

/* ---------- 项目卡片 ---------- */
.project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(18px, 3vw, 28px); }
.project-card { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
.project-card:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(28,26,23,.08); border-color: var(--line-strong); }
.project-card__top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
.project-card__no { font-family: var(--font-serif); font-style: italic; color: var(--accent); font-size: 15px; }
.project-card__thumb { aspect-ratio: 16 / 9; background: repeating-linear-gradient(45deg, transparent, transparent 9px, rgba(0,0,0,.018) 9px, rgba(0,0,0,.018) 10px), var(--placeholder-bg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 12px; letter-spacing: .04em; margin-bottom: 16px; overflow: hidden; }
.project-card__thumb img { width: 100%; height: 100%; object-fit: cover; }
.project-card__title { font-family: var(--font-serif); font-size: clamp(20px, 2.8vw, 26px); font-weight: 500; line-height: 1.25; margin: 0 0 8px; }
.project-card__sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 14px; flex: 1; }
.project-card__stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }
.project-card__stats strong { color: var(--ink); }
.project-card__foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.project-card__link { font-size: 13px; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
.project-card__link:hover { gap: 10px; }

/* ---------- Contact ---------- */
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6vw, 72px); }
.contact-list { border-top: 1px solid var(--line-strong); }
.contact-row { display: grid; grid-template-columns: 110px 1fr; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: center; }
.contact-row__label { font-size: 13px; color: var(--ink-faint); letter-spacing: .04em; }
.contact-row__value { font-size: 15px; word-break: break-all; }
.contact-row__value a { border-bottom: 1px solid var(--line-strong); }
.contact-empty { font-size: 14px; color: var(--ink-faint); }
.privacy-note { margin-top: 24px; font-size: 13px; color: var(--ink-soft); background: var(--bg-alt); border: 1px solid var(--line); padding: 16px 18px; border-radius: var(--radius); }

/* ---------- Footer ---------- */
.site-footer { border-top: 1px solid var(--line-strong); padding: 40px 0 36px; background: var(--bg-alt); }
.footer-inner { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.footer-brand { font-family: var(--font-serif); font-size: 26px; font-weight: 500; }
.footer-tag { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin-top: 6px; }
.footer-note { font-size: 12px; color: var(--ink-faint); max-width: 46ch; margin-top: 12px; }
.footer-top { font-size: 13px; color: var(--ink-soft); border: 1px solid var(--line-strong); padding: 8px 14px; border-radius: 999px; }
.footer-top:hover { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ==========================================================================
   项目详情页
   ========================================================================== */
.project-main { padding-bottom: var(--section-y); }
.project-hero { padding: clamp(40px, 7vw, 80px) 0 clamp(30px, 5vw, 54px); border-bottom: 1px solid var(--line-strong); }
.project-back { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); margin-bottom: 28px; }
.project-back:hover { color: var(--accent); }
.project-hero__cat { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
.project-hero__title { font-family: var(--font-serif); font-size: clamp(34px, 6.5vw, 64px); line-height: 1.08; font-weight: 500; letter-spacing: -.01em; margin: 0 0 18px; }
.project-hero__sub { font-size: clamp(16px, 2.5vw, 20px); color: var(--ink-soft); max-width: 60ch; margin: 0 0 22px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 30px 0 0; }
.stat { background: var(--paper); padding: 20px 16px; }
.stat__value { font-family: var(--font-serif); font-size: clamp(24px, 4vw, 36px); line-height: 1; color: var(--ink); }
.stat__label { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
.stats-note { font-size: 12px; color: var(--ink-faint); margin-top: 10px; }
.disclaimer { margin-top: 28px; background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 14px 18px; font-size: 14px; color: #554527; border-radius: 0 var(--radius) var(--radius) 0; }
.project-body { padding-top: clamp(36px, 6vw, 60px); }
.project-section { display: grid; grid-template-columns: 220px 1fr; gap: clamp(20px, 5vw, 60px); padding: 24px 0; border-bottom: 1px solid var(--line); }
.project-section h2 { font-size: 15px; font-weight: 600; margin: 0; color: var(--ink); }
.sec-no { color: var(--accent); font-family: var(--font-serif); font-style: italic; margin-right: 10px; }
.project-section__body p { margin: 0 0 14px; color: var(--ink-soft); font-size: 16px; }
.project-section__body p:last-child { margin-bottom: 0; }

/* ---------- 素材（图片 / 视频） ---------- */
.evidence { margin-top: 48px; }
.evidence h2 { font-family: var(--font-serif); font-size: 28px; font-weight: 500; margin: 0 0 20px; }
.evidence-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.evidence-item { margin: 0; background: repeating-linear-gradient(45deg, transparent, transparent 9px, rgba(0,0,0,.018) 9px, rgba(0,0,0,.018) 10px), var(--placeholder-bg); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 13px; text-align: center; padding: 16px; min-height: 200px; border-radius: var(--radius); overflow: hidden; }
.evidence-item img { width: 100%; height: auto; object-fit: contain; cursor: zoom-in; }
.evidence-item video { width: 100%; height: auto; max-height: 70vh; background: #000; border-radius: var(--radius); }
.evidence-item figcaption { font-size: 12px; color: var(--ink-soft); padding-top: 10px; text-align: left; width: 100%; }
.evidence-note { font-size: 13px; color: var(--ink-faint); margin-top: 16px; }

.project-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 60px; padding-top: 28px; border-top: 1px solid var(--line-strong); }
.project-nav a { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); transition: border-color .2s ease, transform .2s ease; }
.project-nav a:hover { border-color: var(--accent); transform: translateY(-3px); }
.project-nav a.next { text-align: right; }
.project-nav__label { font-size: 12px; color: var(--ink-faint); letter-spacing: .1em; text-transform: uppercase; }
.project-nav__title { font-family: var(--font-serif); font-size: 18px; margin-top: 8px; }

/* ---------- 灯箱 ---------- */
.lightbox { position: fixed; inset: 0; z-index: 200; background: rgba(20,18,15,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6vh 5vw; }
.lightbox[hidden] { display: none; }
.lightbox__stage { max-width: 92vw; max-height: 80vh; display: flex; align-items: center; justify-content: center; }
.lightbox__stage img { max-width: 92vw; max-height: 80vh; object-fit: contain; }
.lightbox__caption { color: #e8e2d6; font-size: 13px; margin: 18px 0 0; text-align: center; }
.lightbox__close { position: absolute; top: 20px; right: 24px; background: transparent; border: 0; color: #fff; font-size: 36px; line-height: 1; width: 44px; height: 44px; }

/* ==========================================================================
   v3 新增：层级强化 + About 内嵌结构 + STAR + 一句话总结
   ========================================================================== */
/* 三级标题统一视觉层级：二级(sub-title) > 正文 > 细项 */
.sub-title { font-family: var(--font-serif); font-size: clamp(21px, 3.4vw, 28px); font-weight: 500; line-height: 1.3; margin: 0 0 18px; }

/* About：个人介绍 / 实践经历 / 核心优势 / 工具技能 */
.about-intro { margin: 34px 0 46px; max-width: 820px; }
.about-intro p { margin: 0 0 16px; color: var(--ink-soft); font-size: clamp(15px, 2vw, 17px); line-height: 1.95; }
.about-intro p:last-child { margin-bottom: 0; }
.about-experience { margin: 46px 0 56px; }
.exp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.exp-item { background: var(--paper); padding: 24px; }
.exp-item h4 { font-size: 15px; font-weight: 600; color: var(--accent); margin: 0 0 12px; letter-spacing: .02em; }
.exp-item p { margin: 0 0 12px; font-size: 14px; line-height: 1.8; color: var(--ink-soft); }
.exp-item p:last-child { margin-bottom: 0; }
.about-competencies, .about-skills { margin-top: 64px; padding-top: 56px; border-top: 1px solid var(--line-strong); }
.about-competencies .lead, .about-skills .lead { margin-bottom: 26px; }

/* comp-card 标题改为 h4（层级：section h2 > sub-title h3 > comp h4） */
.comp-card__body h4 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
.skill-group h4 { font-size: 16px; font-weight: 600; margin: 0 0 14px; }

/* 项目卡片补充经历区块 */
.additional-wrap { margin-top: 56px; padding-top: 44px; border-top: 1px solid var(--line-strong); }

/* 项目详情：STAR 段落 + 一句话总结 + 素材需求 */
.project-hero__type { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; }
.project-hero__type span { color: var(--ink-faint); }
.sec-label { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 600; font-family: var(--font-sans); }
.project-section { grid-template-columns: 150px 1fr; }
.project-section__body p { margin: 0 0 14px; font-size: clamp(15px, 2vw, 17px); line-height: 1.9; color: var(--ink-soft); }
.project-section__body p:last-child { margin-bottom: 0; }
.project-section--result { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 22px 24px; border-radius: var(--radius); }
.project-section--result .project-section__body p { color: var(--ink); }

.one-liner { margin: 40px 0; padding: 28px 30px; background: var(--ink); color: #fff; border-radius: var(--radius); }
.one-liner__label { display: block; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #c9b99d; margin-bottom: 12px; }
.one-liner p { font-family: var(--font-serif); font-size: clamp(20px, 3.4vw, 30px); line-height: 1.45; margin: 0; }

.materials { margin: 0 0 34px; padding: 18px 20px; border: 1px dashed var(--line-strong); border-radius: var(--radius); }
.materials__label { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
.materials p { margin: 0; font-size: 14px; line-height: 1.75; color: var(--ink-soft); }

/* 结果大数字更突出（仅详情页 stats） */
.stat__value { font-family: var(--font-serif); font-size: clamp(34px, 6vw, 52px); line-height: 1; color: var(--ink); }

/* ==========================================================================
   响应式
   ========================================================================== */
@media (max-width: 1020px) {
  .nav {
    position: absolute; top: 100%; left: 0; right: 0; background: var(--bg);
    border-bottom: 1px solid var(--line-strong); flex-direction: column;
    align-items: stretch; gap: 0; padding: 8px var(--pad) 16px; display: none; max-height: 76vh; overflow-y: auto;
  }
  .nav.is-open { display: flex; }
  .nav a { padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .nav a::after { display: none; }
  .menu-toggle { display: flex; }
}

@media (max-width: 780px) {
  .hero-grid { grid-template-columns: 1fr; }
  .photo-frame { order: -1; width: 120px; }
  .comp-grid, .skill-grid, .contact-grid, .exp-grid { grid-template-columns: 1fr; }
  .project-grid { grid-template-columns: 1fr; }
  .one-liner { padding: 22px 20px; }
  .evidence-grid { grid-template-columns: 1fr; }
  .project-section { grid-template-columns: 1fr; gap: 8px; }
  .project-nav { grid-template-columns: 1fr; }
  .project-nav a.next { text-align: left; }
}

@media (max-width: 520px) {
  .fact, .resume-item { grid-template-columns: 1fr; }
  .resume-item__time { text-align: left; }
  .contact-row { grid-template-columns: 1fr; gap: 4px; }
  .comp-card { grid-template-columns: 34px 1fr; gap: 12px; padding: 20px; }
  .header-inner { min-height: 58px; }
  .brand small { display: none; }
  .photo-frame { width: 104px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

@media print {
  .site-header, .lightbox, .project-nav, .btn, .menu-toggle { display: none !important; }
  body { background: #fff; color: #000; }
  .section { padding-block: 24px; }
  .section--alt { background: #fff; }
}

</style>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header id="site-header" class="site-header"></header>

  <main id="main">
    <section id="home" class="section hero" aria-labelledby="hero-title"></section>
    <section id="about" class="section section--alt" aria-labelledby="about-title"></section>
    <section id="portfolio" class="section" aria-labelledby="portfolio-title"></section>
    <section id="contact" class="section section--alt" aria-labelledby="contact-title"></section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <div id="lightbox" class="lightbox" hidden aria-hidden="true">
    <button class="lightbox__close" type="button" aria-label="关闭">×</button>
    <div class="lightbox__stage"></div>
    <p class="lightbox__caption"></p>
  </div>

  <noscript>
    <div class="noscript">本网站需要开启 JavaScript 才能正常显示中英文切换与项目详情。请开启后刷新页面。</div>
  </noscript>

  <script src="content.js"></script>
  <script>
/* ==========================================================================
 * Rae Portfolio — 交互逻辑
 * 从 content.js 读取内容，渲染首页与项目详情页，处理语言 / 路由 / 灯箱 / 视频。
 * 维护内容只需改 content.js。所有素材路径为空时显示占位，不生成破图或无效链接。
 * ========================================================================== */

(function () {
  'use strict';

  var DATA = window.SITE_DATA;
  var STORAGE_KEY = 'rae-portfolio-lang';
  var isProjectPage = !!document.getElementById('project-main');
  var lang = getLang();
  var navObserver = null;
  var lightboxReady = false;

  function getLang() {
    var p = new URLSearchParams(location.search).get('lang');
    if (p === 'zh' || p === 'en') return p;
    var s = null;
    try { s = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    return s === 'en' ? 'en' : 'zh';
  }

  function t() { return DATA[lang]; }

  function setLang(next) {
    lang = next;
    try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
    document.documentElement.lang = next === 'zh' ? 'zh-CN' : 'en';
    try {
      var url = new URL(location.href);
      url.searchParams.set('lang', next);
      history.replaceState(null, '', url);
    } catch (e) {}
    render();
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function paras(arr) {
    return (arr || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
  }

  function navHref(id) { return isProjectPage ? 'index.html#' + id : '#' + id; }
  function projectUrl(id) { return 'project.html?id=' + encodeURIComponent(id) + '&lang=' + lang; }

  /* ---------------- Toast ---------------- */
  function toast(msg) {
    var box = document.getElementById('toast');
    if (!box) {
      box = document.createElement('div');
      box.id = 'toast';
      box.className = 'toast';
      box.setAttribute('role', 'status');
      document.body.appendChild(box);
    }
    box.textContent = msg;
    box.classList.add('is-show');
    clearTimeout(box._timer);
    box._timer = setTimeout(function () { box.classList.remove('is-show'); }, 3800);
  }

  /* ---------------- 导航 ---------------- */
  function renderHeader() {
    var d = t();
    var links = d.nav.map(function (n) {
      return '<a href="' + navHref(n.id) + '" data-nav="' + n.id + '">' + esc(n.label) + '</a>';
    }).join('');
    document.getElementById('site-header').innerHTML =
      '<div class="wrap header-inner">' +
        '<a class="brand" href="' + (isProjectPage ? 'index.html' : '#home') + '">' +
          esc(d.siteName) + '<small>Portfolio</small></a>' +
        '<nav class="nav" id="primary-nav" aria-label="主导航">' + links + '</nav>' +
        '<div class="header-tools">' +
          '<div class="lang-toggle" role="group" aria-label="语言切换">' +
            '<button type="button" data-lang="zh" class="' + (lang === 'zh' ? 'is-active' : '') + '">中</button>' +
            '<button type="button" data-lang="en" class="' + (lang === 'en' ? 'is-active' : '') + '">EN</button>' +
          '</div>' +
          '<button class="menu-toggle" id="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false">' +
            '<span></span><span></span><span></span></button>' +
        '</div>' +
      '</div>';
    document.querySelectorAll('[data-lang]').forEach(function (b) {
      b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
    });
    var toggle = document.getElementById('menu-toggle');
    var nav = document.getElementById('primary-nav');
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    nav.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') {
        nav.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  }

  function highlightNav() {
    if (isProjectPage) return;
    if (navObserver) { navObserver.disconnect(); navObserver = null; }
    var links = document.querySelectorAll('[data-nav]');
    navObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          links.forEach(function (a) {
            a.classList.toggle('is-active', a.getAttribute('data-nav') === en.target.id);
          });
        }
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    t().nav.forEach(function (n) {
      var el = document.getElementById(n.id);
      if (el) navObserver.observe(el);
    });
  }

  /* ---------------- Hero ---------------- */
  function renderHero() {
    var d = t().hero, ui = t().ui;
    var chips = d.seeking.map(function (s) { return '<span class="chip chip--accent">' + esc(s) + '</span>'; }).join('');
    var photo = d.photo
      ? '<img src="' + esc(d.photo) + '" alt="' + esc(d.name) + '" />'
      : '<span class="photo-frame__icon">R</span>' +
        '<span class="photo-frame__text">' + esc(d.photoPlaceholder) + '</span>' +
        '<span class="photo-frame__hint">' + esc(d.photoHint) + '</span>';
    document.getElementById('home').innerHTML =
      '<div class="wrap hero-grid">' +
        '<div class="hero-copy">' +
          '<p class="eyebrow">' + esc(d.eyebrow) + '</p>' +
          '<h1 class="hero-name" id="hero-title">' + esc(d.name) + '<span class="en">' + esc(d.nameEn) + '</span></h1>' +
          '<p class="hero-tagline">' + esc(d.tagline) + '</p>' +
          '<p class="hero-role">' + esc(d.role) + '</p>' +
          '<div class="hero-seeking"><span class="hero-seeking__label">' + esc(ui.seeking) + '</span>' +
            '<div class="chip-row">' + chips + '</div></div>' +
          '<p class="hero-intro">' + esc(d.intro).replace(/\n/g, '<br />') + '</p>' +
          '<div class="hero-meta">' +
            '<div><strong>' + esc(ui.location) + '：</strong>' + esc(d.location) + '</div>' +
            '<div><strong>' + esc(ui.availability) + '：</strong>' + esc(d.availability) + '</div>' +
          '</div>' +
          '<div class="btn-row">' +
            '<a class="btn btn--solid" href="#portfolio">' + esc(ui.viewWork) + '</a>' +
            '<a class="btn btn--ghost" href="#about">' + esc(ui.aboutMe) + '</a>' +
            '<button class="btn btn--ghost" type="button" data-resume>' + esc(ui.downloadResume) + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="photo-frame">' + photo + '</div>' +
      '</div>';
  }

  /* ---------------- About（个人介绍 + 实践经历 + 核心优势 + 工具技能） ---------------- */
  function renderAbout() {
    var d = t().about, comp = t().competencies, sk = t().skills;

    var intro = '<div class="about-intro"><h3 class="sub-title">' + esc(d.introTitle) + '</h3>' + paras(d.intro) + '</div>';

    var exps = d.experiences.map(function (e) {
      return '<div class="exp-item"><h4>' + esc(e.title) + '</h4>' + paras(e.paragraphs) + '</div>';
    }).join('');
    var experience = '<div class="about-experience"><h3 class="sub-title">' + esc(d.experienceTitle) + '</h3>' +
      '<div class="exp-grid">' + exps + '</div></div>';

    var comps = comp.items.map(function (it) {
      return '<article class="comp-card">' +
        '<div class="comp-card__no">' + esc(it.no) + '</div>' +
        '<div class="comp-card__body"><h4>' + esc(it.title) + '</h4>' +
        '<p>' + esc(it.desc) + '</p></div></article>';
    }).join('');
    var competencies = '<div class="about-competencies" id="competencies">' +
      '<p class="eyebrow">' + esc(comp.eyebrow) + '</p>' +
      '<h3 class="sub-title">' + esc(comp.title) + '</h3>' +
      '<p class="lead">' + esc(comp.intro) + '</p>' +
      '<div class="comp-grid">' + comps + '</div></div>';

    var groups = sk.groups.map(function (g) {
      var tools = g.tools.map(function (x) { return '<span class="chip">' + esc(x) + '</span>'; }).join('');
      return '<div class="skill-group"><h4>' + esc(g.title) + '</h4>' +
        '<div class="chip-row">' + tools + '</div>' +
        '<p class="skill-group__usage">' + esc(g.usage) + '</p></div>';
    }).join('');
    var skills = '<div class="about-skills" id="skills">' +
      '<p class="eyebrow">' + esc(sk.eyebrow) + '</p>' +
      '<h3 class="sub-title">' + esc(sk.title) + '</h3>' +
      '<p class="lead">' + esc(sk.intro) + '</p>' +
      '<div class="skill-grid">' + groups + '</div>' +
      '<p class="skill-note">' + esc(sk.note) + '</p></div>';

    document.getElementById('about').innerHTML =
      '<div class="wrap">' +
        '<p class="eyebrow">' + esc(d.eyebrow) + '</p>' +
        '<h2 class="section-title" id="about-title">' + esc(d.title) + '</h2>' +
        intro + experience + competencies + skills +
      '</div>';
  }

  /* ---------------- 项目卡片 ---------------- */
  function renderCard(p) {
    var d = t();
    var badges = p.badge.map(function (b) { return '<span class="chip">' + esc(b) + '</span>'; }).join('');
    var stats = '';
    if (p.stats && p.stats.length) {
      stats = '<div class="project-card__stats">' + p.stats.map(function (s) {
        return '<span><strong>' + esc(s.value) + '</strong> ' + esc(s.label) + '</span>';
      }).join('') + '</div>';
    }
    var thumb = p.cover
      ? '<img src="' + esc(p.cover) + '" alt="' + esc(p.title) + '" />'
      : '<span>' + esc(d.ui.placeholder) + '</span>';
    return '<a class="project-card" href="' + projectUrl(p.id) + '">' +
      '<div class="project-card__top"><span class="project-card__no">' + esc(p.no) + '</span>' +
        '<div class="chip-row">' + badges + '</div></div>' +
      '<div class="project-card__thumb">' + thumb + '</div>' +
      '<h3 class="project-card__title">' + esc(p.title) + '</h3>' +
      '<p class="project-card__sub">' + esc(p.subtitle) + '</p>' +
      stats +
      '<div class="project-card__foot"><span class="project-card__link">' + esc(d.ui.readMore) + ' →</span></div>' +
    '</a>';
  }

  function renderProjectsInto(el, featured) {
    var list = t().projects.filter(function (p) { return !!p.featured === featured; });
    el.innerHTML = '<div class="project-grid">' + list.map(renderCard).join('') + '</div>';
  }

  function renderPortfolio() {
    document.getElementById('portfolio').innerHTML =
      '<div class="wrap">' +
        '<p class="eyebrow">Portfolio</p>' +
        '<h2 class="section-title" id="portfolio-title">' +
          esc(t().ui.featured) + '</h2>' +
        '<div id="featured-grid"></div>' +
        '<div class="additional-wrap"><h3 class="sub-title" id="experience-title">' + esc(t().ui.additional) + '</h3>' +
          '<div id="additional-grid"></div></div>' +
      '</div>';
    renderProjectsInto(document.getElementById('featured-grid'), true);
    renderProjectsInto(document.getElementById('additional-grid'), false);
  }

  /* ---------------- Contact ---------------- */
  function renderContact() {
    var d = t().contact;
    var rows = '';
    function row(label, value, href) {
      if (!value) return '';
      var v = href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(value) + '</a>' : esc(value);
      return '<div class="contact-row"><span class="contact-row__label">' + esc(label) + '</span>' +
        '<span class="contact-row__value">' + v + '</span></div>';
    }
    rows += row(d.labels.email, d.email, d.email ? 'mailto:' + d.email : null);
    rows += row(d.labels.phone, d.phone, d.phone ? 'tel:' + d.phone.replace(/\s/g, '') : null);
    rows += row(d.labels.github, d.github, d.github);
    rows += row(d.labels.linkedin, d.linkedin, d.linkedin);
    if (d.resumePdf) {
      rows += '<div class="contact-row"><span class="contact-row__label">' + esc(d.labels.resume) + '</span>' +
        '<span class="contact-row__value"><a href="' + esc(d.resumePdf) + '" target="_blank" rel="noopener">PDF ↓</a></span></div>';
    }
    if (!rows) {
      rows = '<p class="contact-empty">' + esc(lang === 'zh' ? '联系方式待确认后公开。' : 'Contact details to be published after confirmation.') + '</p>';
    }
    document.getElementById('contact').innerHTML =
      '<div class="wrap contact-grid">' +
        '<div><p class="eyebrow">' + esc(d.eyebrow) + '</p>' +
          '<h2 class="section-title" id="contact-title">' + esc(d.title) + '</h2>' +
          '<p class="lead">' + esc(d.intro) + '</p></div>' +
        '<div><div class="contact-list">' + rows + '</div>' +
          '<p class="privacy-note">' + esc(d.privacyNote) + '</p></div>' +
      '</div>';
  }

  function renderFooter() {
    var d = t().footer;
    document.getElementById('site-footer').innerHTML =
      '<div class="wrap footer-inner">' +
        '<div><div class="footer-brand">' + esc(t().siteName) + '</div>' +
          '<div class="footer-tag">' + esc(d.tagline) + '</div>' +
          '<p class="footer-note">' + esc(d.note) + '</p></div>' +
        '<button class="footer-top" type="button" id="back-to-top">↑ ' + esc(d.backToTop) + '</button>' +
      '</div>';
    document.getElementById('back-to-top').addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  /* ---------------- 素材（图片 / 视频） ---------------- */
  function evidenceHTML(p) {
    var d = t();
    var blockTitle = lang === 'zh' ? '关键素材' : 'Key material';
    if (!p.evidence || !p.evidence.length) {
      return '<div class="evidence"><h2 class="sub-title">' + esc(blockTitle) + '</h2>' +
        '<div class="evidence-grid"><div class="evidence-item"><span>' + esc(d.ui.placeholder) + '</span></div></div>' +
        (p.evidenceNote ? '<p class="evidence-note">' + esc(p.evidenceNote) + '</p>' : '') + '</div>';
    }
    var items = p.evidence.map(function (ev) {
      if (ev.type === 'video') {
        return '<figure class="evidence-item evidence-item--video">' +
          '<video controls playsinline preload="metadata" poster="' + esc(ev.poster || '') + '">' +
            '<source src="' + esc(ev.src) + '" type="video/mp4" />' +
            esc(lang === 'zh' ? '浏览器不支持视频播放' : 'Video not supported') +
          '</video>' +
          (ev.caption ? '<figcaption>' + esc(ev.caption) + '</figcaption>' : '') + '</figure>';
      }
      return '<figure class="evidence-item">' +
        '<img src="' + esc(ev.src) + '" alt="' + esc(ev.caption || '') + '" data-zoom loading="lazy" />' +
        (ev.caption ? '<figcaption>' + esc(ev.caption) + '</figcaption>' : '') + '</figure>';
    }).join('');
    return '<div class="evidence"><h2 class="sub-title">' + esc(blockTitle) + '</h2>' +
      '<div class="evidence-grid">' + items + '</div>' +
      (p.evidenceNote ? '<p class="evidence-note">' + esc(p.evidenceNote) + '</p>' : '') + '</div>';
  }

  /* ---------------- 项目详情页（STAR） ---------------- */
  function renderProjectPage() {
    var d = t();
    var params = new URLSearchParams(location.search);
    var id = params.get('id');
    var idx = d.projects.findIndex(function (p) { return p.id === id; });
    var main = document.getElementById('project-main');

    if (idx === -1) {
      main.innerHTML = '<div class="wrap" style="padding-block:100px">' +
        '<p class="eyebrow">404</p><h1 class="section-title">' +
        esc(lang === 'zh' ? '未找到该项目' : 'Project not found') + '</h1>' +
        '<a class="btn btn--solid" href="index.html">' + esc(d.ui.backHome) + '</a></div>';
      return;
    }

    var p = d.projects[idx];
    var cat = d.categories.find(function (c) { return c.key === p.category; });
    var badges = p.badge.map(function (b) { return '<span class="chip">' + esc(b) + '</span>'; }).join('');

    var stats = '';
    if (p.stats && p.stats.length) {
      stats = '<div class="stats">' + p.stats.map(function (s) {
        return '<div class="stat"><div class="stat__value">' + esc(s.value) + '</div>' +
          '<div class="stat__label">' + esc(s.label) + '</div></div>';
      }).join('') + '</div>' + (p.statsNote ? '<p class="stats-note">' + esc(p.statsNote) + '</p>' : '');
    }

    var secLabels = { situation: d.ui.situation, task: d.ui.task, action: d.ui.action, result: d.ui.result };
    var sections = p.sections.map(function (sec) {
      var label = secLabels[sec.key] || '';
      var isResult = sec.key === 'result';
      var body = sec.body.map(function (para) { return '<p>' + esc(para) + '</p>'; }).join('');
      return '<div class="project-section' + (isResult ? ' project-section--result' : '') + '">' +
        '<h2><span class="sec-label">' + esc(label) + '</span></h2>' +
        '<div class="project-section__body">' + body + '</div></div>';
    }).join('');

    var oneLine = p.oneLine
      ? '<div class="one-liner"><span class="one-liner__label">' + esc(d.ui.oneLine) + '</span>' +
        '<p>' + esc(p.oneLine) + '</p></div>'
      : '';
    var materials = p.materials
      ? '<div class="materials"><span class="materials__label">' + esc(d.ui.materials) + '</span><p>' + esc(p.materials) + '</p></div>'
      : '';

    var prev = d.projects[idx - 1];
    var next = d.projects[idx + 1];
    var navHtml = '<div class="project-nav">' +
      (prev ? '<a href="' + projectUrl(prev.id) + '"><div class="project-nav__label">← ' + esc(d.ui.prevProject) + '</div>' +
        '<div class="project-nav__title">' + esc(prev.title) + '</div></a>' : '<span></span>') +
      (next ? '<a class="next" href="' + projectUrl(next.id) + '"><div class="project-nav__label">' + esc(d.ui.nextProject) + ' →</div>' +
        '<div class="project-nav__title">' + esc(next.title) + '</div></a>' : '<span></span>') + '</div>';

    document.title = p.title + ' — Rae';
    main.innerHTML =
      '<div class="wrap">' +
        '<div class="project-hero">' +
          '<a class="project-back" href="index.html#portfolio">← ' + esc(d.ui.backHome) + '</a>' +
          '<div class="project-hero__cat">' + esc(cat ? cat.name : (p.type || '')) + ' · ' + esc(p.no) + '</div>' +
          '<h1 class="project-hero__title">' + esc(p.title) + '</h1>' +
          '<p class="project-hero__sub">' + esc(p.subtitle) + '</p>' +
          (p.type ? '<p class="project-hero__type"><span>' + esc(d.ui.projectType) + '：</span>' + esc(p.type) + '</p>' : '') +
          '<div class="chip-row">' + badges + '</div>' + stats +
          (p.disclaimer ? '<div class="disclaimer">' + esc(p.disclaimer) + '</div>' : '') +
        '</div>' +
        '<div class="project-body">' + sections + oneLine + materials + evidenceHTML(p) + navHtml + '</div>' +
      '</div>';
  }

  /* ---------------- 灯箱 ---------------- */
  function initLightbox() {
    var box = document.getElementById('lightbox');
    if (!box || lightboxReady) return;
    lightboxReady = true;
    var stage = box.querySelector('.lightbox__stage');
    var cap = box.querySelector('.lightbox__caption');
    var close = box.querySelector('.lightbox__close');
    document.addEventListener('click', function (e) {
      var img = e.target.closest('[data-zoom]');
      if (!img) return;
      stage.innerHTML = '';
      var clone = document.createElement('img');
      clone.src = img.src; clone.alt = img.alt || '';
      stage.appendChild(clone);
      cap.textContent = img.alt || '';
      box.hidden = false;
      box.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    });
    function closeBox() {
      box.hidden = true;
      box.setAttribute('aria-hidden', 'true');
      stage.innerHTML = '';
      document.body.style.overflow = '';
    }
    close.addEventListener('click', closeBox);
    box.addEventListener('click', function (e) { if (e.target === box) closeBox(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeBox(); });
  }

  /* ---------------- 简历下载（读 content.js 配置） ---------------- */
  function bindResume() {
    document.querySelectorAll('[data-resume]').forEach(function (b) {
      b.addEventListener('click', function () {
        var pdf = t().contact.resumePdf;
        if (pdf) {
          window.open(pdf, '_blank');
        } else {
          toast(lang === 'zh'
            ? '简历 PDF 待上传：上传后将在此提供下载。'
            : 'Résumé PDF pending: the download will appear here once uploaded.');
        }
      });
    });
  }

  /* ---------------- 渲染入口 ---------------- */
  function render() {
    renderHeader();
    if (isProjectPage) {
      renderProjectPage();
    } else {
      renderHero();
      renderAbout();
      renderPortfolio();
      renderContact();
      highlightNav();
    }
    renderFooter();
    bindResume();
    initLightbox();
  }

  document.addEventListener('DOMContentLoaded', render);
})();

</script>
</body>
</html>
